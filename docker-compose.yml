# Local demo: API + Prometheus + Grafana with a ready dashboard.
#   docker compose up -d --build
#   API        http://localhost:8000/docs
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000   (anonymous viewer, admin/admin)
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Example checks: Prometheus and Grafana themselves, plus one that is always down.
      INFRA_MONITOR_SERVICES: "prometheus=prometheus:9090,grafana=grafana:3000,missing=missing-db:5432"
      INFRA_MONITOR_CHECK_TIMEOUT: "1.0"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin   # local demo only
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/infra-monitor.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
